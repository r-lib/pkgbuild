name: rtools.yaml

on:
  push:
    branches: main
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  pkgbuild:
    runs-on: windows-latest
    name: pkgbuild - ${{ matrix.config.r }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { r: 'devel' }
          - { r: 'next' }
          - { r: 'release' }
          - { r: 'oldrel/1' }
          - { r: 'oldrel/2' }
          - { r: 'oldrel/3' }
          - { r: 'oldrel/4' }
          - { r: 'oldrel/5' }

    steps:
    - name: Install rig
      run: |
        irm https://r-lib.github.io/rig/install.ps1 | iex
        "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        # rig's R/Rscript quick links; the .exe installer used to add this
        rig system dirs --binary | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Remove pre-installed R
      run: |
        $rver = (rig list --json).replace("\", "\\") | jq -r .[0].name
        mv "C:\Program Files\R/R-$rver" "C:\Program Files\bak"
        mv C:\rtools* C:\bakrtoolsbak
        rig system clean-registry
        rig ls
        rig system rtools ls

    - name: Install R
      run: |
        rig add ${{ matrix.config.r }} --without-pak

    - name: Install Rtools
      run: |
        rig rtools add
        rig ls
        rig system rtools ls

    - uses: actions/checkout@v4
    - uses: r-hub/actions/debug-shell@v1
    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        dependencies: '"hard"'
        cache-version: 'rtools-${{ matrix.config.r }}'
        install-pandoc: false

    - name: Environment
      run: |
        Sys.getenv()
      shell: Rscript {0}

    - name: Install pkgbuild
      run: |
        cd ..
        RS CMD build pkgbuild
        $file = (dir pkgbuild_*.tar.gz).name
        RS CMD INSTALL $file

    - name: Rtools finding
      run: |
        ok <- pkgbuild::find_rtools(debug = TRUE)
        if (!ok) stop("No Rtools. :(")
      shell: Rscript {0}

    - name: Test pkgbuild
      run: |
        srcjpeg <- download.packages("jpeg", ".")[,2]
        binjpeg <- pkgbuild::build(srcjpeg, binary = TRUE)
        install.packages(binjpeg, repos = NULL)
        library(jpeg)
      shell: Rscript {0}
